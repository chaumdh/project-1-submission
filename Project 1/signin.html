<!DOCTYPE html>
<html lang="en">
<head>
    <title>Splashes Sign In</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Fonts & Colors -->
    <link rel="stylesheet" href="css/variables.css">
    
    <!-- Sign In Styles -->
    <link rel="stylesheet" href="css/signin.css">
    


    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body id="signin-page">

    <div id="container">
        <!-- Top Logo -->
        <div class="logo-wrapper text-center">
            <img src="images/splash-wave.png" alt="Splashes Logo" class="brand-logo">
        </div>

        <!-- Main Sign In Card Container -->
        <div class="signin-card-wrapper">
            
            <img src="images/shark-full.png" alt="Mascot" class="mascot-img">

            <div class="signin-card">
                <h1 class="card-title text-center">SIGN IN</h1>

                <form id="signin-form">
                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email">Email <span class="text-danger">*</span></label>
                        <input type="email" id="email" class="form-control custom-input" required>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group mb-1">
                        <label for="password">Password <span class="text-danger">*</span></label>
                        <input type="password" id="password" class="form-control custom-input" required>
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="text-right mb-4">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Buttons -->
                    <button type="submit" class="btn btn-signin w-100 mb-3">Sign In</button>
                    <a href="signup.html" class="btn btn-signup w-100">Sign Up</a>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery, Popper, Bootstrap, and Custom JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/signin.js"></script>

</body>
</html>
